experiment: candidate_filtering
method: development_calibrated_hard_filter

rule:
  threshold_formula: "3 * MAE_dev"
  retain_missing_predictions: true
  preserve_msfinder_order: true
  rank_guard: false
  soft_reranking: false

inputs:
  metabobase: data/local/candidate_filtering/metabobase_candidate_predictions.csv
  riken_plasma: data/local/candidate_filtering/riken_plasma_candidate_predictions.csv

# The reported mae_dev_seconds values are rounded to three decimals.
# threshold_seconds stores the frozen threshold calculated from the
# corresponding full-precision development MAE before rounding.
development:
  metabobase:
    n_queries: 30
    shared_query_ids_across_methods: true
    excluded_from_final_evaluation: true
    methods:
      rt_transformer_tl:
        mae_dev_seconds: 147.239
        threshold_seconds: 441.716
      deepgcn_rt_tl:
        mae_dev_seconds: 57.937
        threshold_seconds: 173.811
      abcort_tl:
        mae_dev_seconds: 58.753
        threshold_seconds: 176.260
      tc_toport:
        mae_dev_seconds: 58.289
        threshold_seconds: 174.868

  riken_plasma:
    n_queries: 30
    shared_query_ids_across_methods: true
    excluded_from_final_evaluation: true
    methods:
      rt_transformer_tl:
        mae_dev_seconds: 53.899
        threshold_seconds: 161.698
      deepgcn_rt_tl:
        mae_dev_seconds: 34.974
        threshold_seconds: 104.921
      abcort_tl:
        mae_dev_seconds: 30.720
        threshold_seconds: 92.160
      tc_toport:
        mae_dev_seconds: 26.992
        threshold_seconds: 80.977
